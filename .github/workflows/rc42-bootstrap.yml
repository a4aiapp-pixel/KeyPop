name: KeyPop RC42 integrated build and emulator gates
on:
  push:
    branches: [feature/rc42-adaptive-intelligence-integrated-20261118]
    paths:
      - '.github/workflows/rc42-bootstrap.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'verification/**'
      - 'docs/KEYPOP_STABLE_SIGNING_CERT_SHA256.txt'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keypop-rc42-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, JUnit, lint and package APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYPOP_SIGNING_STORE_PASSWORD: ${{ secrets.KEYPOP_SIGNING_STORE_PASSWORD }}
      KEYPOP_SIGNING_KEY_ALIAS: ${{ secrets.KEYPOP_SIGNING_KEY_ALIAS }}
      KEYPOP_SIGNING_KEY_PASSWORD: ${{ secrets.KEYPOP_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check integrated source and permanent upgrade identity
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/aetherkeys/keyboard/AetherImeService.kt
          test -s app/src/main/java/com/aetherkeys/keyboard/KeyPopAdaptiveServiceController.kt
          python3 - <<'PY'
          from pathlib import Path
          config=Path("app/build.gradle.kts").read_text()
          assert 'applicationIdSuffix = ".stablev2"' in config, "Production package ID changed"
          assert 'applicationIdSuffix = ".rc42preview"' in config, "Preview package ID changed"
          assert "val stableBaseVersionCode = 100" in config, "Version baseline changed"
          assert "versionCode = stableBaseVersionCode + actionsBuildIncrement" in config, (
              "CI build number must increase versionCode for in-place updates"
          )
          assert 'System.getenv("GITHUB_RUN_NUMBER")' in config, "CI version counter missing"
          assert 'KEYPOP_SIGNING_KEYSTORE_PATH' in config and 'keypopStable' in config
          print("Upgrade contract OK: fixed package IDs, monotonic version floor and stable signing")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure stable signing from ONE mobile-friendly secret or legacy four secrets
        shell: bash
        env:
          KEYPOP_SIGNING_BOOTSTRAP_ENV: ${{ secrets.KEYPOP_SIGNING_BOOTSTRAP_ENV }}
          KEYPOP_SIGNING_KEYSTORE_B64: ${{ secrets.KEYPOP_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYPOP_SIGNING_BOOTSTRAP_ENV" ]]; then
            # Parse one GitHub encrypted secret; NEVER eval arbitrary shell content.
            # Only the four whitelisted values are accepted.
            python3 - <<'PY'
          import os
          import base64
          import pathlib
          import re
          text = os.environ['KEYPOP_SIGNING_BOOTSTRAP_ENV']
          allowed = {
              'KEYPOP_SIGNING_KEYSTORE_B64', 'KEYPOP_SIGNING_STORE_PASSWORD',
              'KEYPOP_SIGNING_KEY_ALIAS', 'KEYPOP_SIGNING_KEY_PASSWORD'
          }
          values = {}
          for raw in text.splitlines():
              if not raw.strip():
                  continue
              key, sep, value = raw.partition('=')
              if not sep or key not in allowed or key in values or not value:
                  raise ValueError('Invalid signing bundle structure')
              values[key] = value
          if set(values) != allowed:
              raise ValueError('Signing bundle has missing or unknown keys')
          for key in allowed - {'KEYPOP_SIGNING_KEYSTORE_B64'}:
              if not re.fullmatch('[A-Za-z0-9_-]{8,128}', values[key]):
                  raise ValueError('Unexpected credential format: ' + key)
          decoded = base64.b64decode(values['KEYPOP_SIGNING_KEYSTORE_B64'], validate=True)
          if len(decoded) < 1000 or len(decoded) > 128000:
              raise ValueError('Invalid keystore size')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'keypop-release.jks'
          target.write_bytes(decoded)
          target.chmod(0o600)
          # Mask all derived passwords before they reach subsequent Actions steps.
          for key in sorted(allowed - {'KEYPOP_SIGNING_KEYSTORE_B64'}):
              print('::add-mask::' + values[key])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('KEYPOP_SIGNING_KEYSTORE_PATH=' + str(target) + '\n')
              for key in sorted(allowed - {'KEYPOP_SIGNING_KEYSTORE_B64'}):
                  handle.write(key + '=' + values[key] + '\n')
              handle.write('HAS_STABLE_SIGNING=true\n')
          print('Stable signing configured from encrypted ONE-secret bundle.')
          PY
          elif [[ -n "$KEYPOP_SIGNING_KEYSTORE_B64" &&
                  -n "$KEYPOP_SIGNING_STORE_PASSWORD" &&
                  -n "$KEYPOP_SIGNING_KEY_ALIAS" &&
                  -n "$KEYPOP_SIGNING_KEY_PASSWORD" ]]; then
            printf '%s' "$KEYPOP_SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keypop-release.jks"
            chmod 600 "$RUNNER_TEMP/keypop-release.jks"
            echo "KEYPOP_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/keypop-release.jks" >> "$GITHUB_ENV"
            echo "HAS_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::notice::No permanent signing credentials: engineering APKs only."
          fi
      - name: Run all unit tests, lint, compile APK and test APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Compile stable signed ARM64 and Universal APKs when provisioned
        if: env.HAS_STABLE_SIGNING == 'true'
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify stable APK signing against pinned public certificate
        if: env.HAS_STABLE_SIGNING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(tr -d '[:space:]' < docs/KEYPOP_STABLE_SIGNING_CERT_SHA256.txt)"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$SDK_ROOT/build-tools"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for APK in app/build/outputs/apk/release/app-arm64-v8a-release.apk app/build/outputs/apk/release/app-universal-release.apk; do
            "$APKSIGNER" verify --verbose "$APK"
            FOUND="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f' | tr -d '[:space:]')"
            test -n "$FOUND"
            if [[ "$FOUND" != "$EXPECTED" ]]; then
              echo "::error::APK certificate does not match pinned KeyPop stable signing identity"
              exit 1
            fi
          done
          echo "Both release APKs share the pinned permanent KeyPop signing certificate"
      - name: Stage engineering APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk dist/KeyPop-RC42-x86_64-debug.apk
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/KeyPop-RC42-arm64-debug.apk
          cp app/build/outputs/apk/debug/app-universal-debug.apk dist/KeyPop-RC42-universal-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/KeyPop-RC42-androidTest.apk
          if [[ "$HAS_STABLE_SIGNING" == "true" ]]; then
            cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/KeyPop-RC42-arm64-v8a-signed.apk
            cp app/build/outputs/apk/release/app-universal-release.apk dist/KeyPop-RC42-universal-signed.apk
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: RC42-debug-engineering-not-stable
          path: dist/*debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: RC42-emulator-test-apk
          path: dist/*androidTest.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed upgrade-compatible release candidates
        if: env.HAS_STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RC42-signed-arm64-universal-candidates
          path: dist/*signed.apk
          if-no-files-found: error
          retention-days: 30

  emulator:
    name: Android emulator editor and prediction verification
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RC42-debug-engineering-not-stable
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: RC42-emulator-test-apk
          path: dist
      - name: Set KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-keypop-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation and actual keyboard launch on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/rc42_smoke_android.sh
      - name: Upload forensic evidence if emulator fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc42-emulator-failure
          path: instrumentation.txt
          if-no-files-found: ignore

  signed-preview:
    name: Publish only stable-signed RC42 prerelease variants
    needs: [android, emulator]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEYPOP_SIGNING_BOOTSTRAP_ENV: ${{ secrets.KEYPOP_SIGNING_BOOTSTRAP_ENV }}
      KEYPOP_SIGNING_KEYSTORE_B64: ${{ secrets.KEYPOP_SIGNING_KEYSTORE_B64 }}
      KEYPOP_SIGNING_STORE_PASSWORD: ${{ secrets.KEYPOP_SIGNING_STORE_PASSWORD }}
      KEYPOP_SIGNING_KEY_ALIAS: ${{ secrets.KEYPOP_SIGNING_KEY_ALIAS }}
      KEYPOP_SIGNING_KEY_PASSWORD: ${{ secrets.KEYPOP_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Check permanent signing credentials
        id: gate
        shell: bash
        run: |
          if [[ -n "$KEYPOP_SIGNING_BOOTSTRAP_ENV" ]] ||
              [[ -n "$KEYPOP_SIGNING_KEYSTORE_B64" &&
                 -n "$KEYPOP_SIGNING_STORE_PASSWORD" &&
                 -n "$KEYPOP_SIGNING_KEY_ALIAS" &&
                 -n "$KEYPOP_SIGNING_KEY_PASSWORD" ]]; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'No signed production candidate is publishable without permanent signing material.'
          fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.signed == 'true'
        with:
          name: RC42-signed-arm64-universal-candidates
          path: dist
      - name: Publish signed ARM64 and Universal prerelease APKs
        if: steps.gate.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=feature/rc42-adaptive-intelligence-integrated-20261118
          LATEST="$(gh api "repos/$GH_REPO/branches/$BRANCH" --jq '.commit.sha')"
          test "$LATEST" = "$GITHUB_SHA"
          TAG=v1.0.42-rc42-stable-signed-preview
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*signed.apk --clobber
          else
            gh release create "$TAG" dist/*signed.apk --target "$GITHUB_SHA" --prerelease \
              --title 'KeyPop RC42 Stable-Signed Preview' \
              --notes 'RC42+ uses fixed package com.aetherkeys.keyboard.stablev2 and one stable certificate. Future versions must increase versionCode and reuse the SAME signing material. RC39/RC40 debug preview APKs cannot be directly updated because their signatures and package IDs differ.'
          fi
