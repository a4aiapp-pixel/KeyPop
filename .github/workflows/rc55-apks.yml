name: KeyPop RC55 signed Android APKs
on:
  workflow_dispatch:
  push:
    branches:
      - feature/rc55-consolidated-intelligence-ux-20261121
jobs:
  build:
    runs-on: ubuntu-latest
    environment: keypop-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore protected release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYPOP_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYPOP_SIGNING_KEYSTORE_BASE64 in keypop-signing environment"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keypop-release.jks"
      - name: Compile signed release and test sources
        env:
          KEYPOP_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/keypop-release.jks
          KEYPOP_SIGNING_STORE_PASSWORD: ${{ secrets.KEYPOP_SIGNING_STORE_PASSWORD }}
          KEYPOP_SIGNING_KEY_ALIAS: ${{ secrets.KEYPOP_SIGNING_KEY_ALIAS }}
          KEYPOP_SIGNING_KEY_PASSWORD: ${{ secrets.KEYPOP_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify release signatures and install identity
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          for apk in "$APK_DIR"/*.apk; do
            "$APK_SIGNER" verify --verbose "$apk"
            "$AAPT" dump badging "$apk" | grep -E "^package: name='com.aetherkeys.keyboard.stablev2' versionCode='[0-9]+' versionName='1.0.55-"
          done
      - name: Verify ARM64 and universal packages
        run: |
          find app/build/outputs/apk/release -name '*.apk' -type f -print
          test "$(find app/build/outputs/apk/release -name '*arm64-v8a*.apk' | wc -l)" -gt 0
          test "$(find app/build/outputs/apk/release -name '*universal*.apk' | wc -l)" -gt 0
      - name: Upload APK deliverables
        uses: actions/upload-artifact@v4
        with:
          name: KeyPop-RC55-signed-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
