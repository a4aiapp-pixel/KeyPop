name: RC45 full settings restoration signed APKs
on:
  push:
    branches: [feature/rc45-restore-settings-launcher-20261118]
    paths:
      - '.github/workflows/rc45-settings-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rc45-settings-signed
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      KEYPOP_SIGNING_BOOTSTRAP_ENV: ${{ secrets.KEYPOP_SIGNING_BOOTSTRAP_ENV }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify launcher is complete settings, not setup
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse('app/src/main/AndroidManifest.xml').getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          app=r.find('application')
          launches=[]
          for activity in app.findall('activity'):
              for filt in activity.findall('intent-filter'):
                  actions=[x.get(ns+'name') for x in filt.findall('action')]
                  cats=[x.get(ns+'name') for x in filt.findall('category')]
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in cats:
                      launches.append(activity.get(ns+'name'))
          assert launches==['.MainActivity'],f'Unexpected launch activities: {launches}'
          src=open('app/src/main/java/com/aetherkeys/keyboard/MainActivity.kt').read()
          for item in ['Customize Keyboard','Typing','Clipboard & Security','Translation','Design Backup','Saved form data & profiles']:
              assert item in src,item
          print('PASS: single launcher opens complete settings dashboard')
          PY
      - name: Configure immutable RC42-RC44 signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYPOP_SIGNING_BOOTSTRAP_ENV"
          python3 - <<'PY'
          import os,base64,pathlib,re
          data=os.environ['KEYPOP_SIGNING_BOOTSTRAP_ENV']
          keys=['KEYPOP_SIGNING_KEYSTORE_B64','KEYPOP_SIGNING_STORE_PASSWORD','KEYPOP_SIGNING_KEY_ALIAS','KEYPOP_SIGNING_KEY_PASSWORD']
          fields={}
          for line in data.splitlines():
              if not line.strip():continue
              k,sep,v=line.partition('=')
              if not sep or k not in keys or k in fields or not v:raise SystemExit('Invalid signing format')
              fields[k]=v
          if set(fields)!=set(keys):raise SystemExit('Missing signing material')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'keypop-permanent.jks'
          p.write_bytes(base64.b64decode(fields.pop('KEYPOP_SIGNING_KEYSTORE_B64'),validate=True))
          p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('KEYPOP_SIGNING_KEYSTORE_PATH='+str(p)+'\n')
              for k,v in fields.items():
                  if not re.fullmatch('[A-Za-z0-9_-]{8,128}',v):raise SystemExit('Invalid secret field')
                  print('::add-mask::'+v)
                  f.write(k+'='+v+'\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 36 platform
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint, debug instrumentation APK and signed release variants
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Verify release signature and package
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$SDK/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -1)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/KeyPop-RC45-arm64-v8a-signed.apk
          cp app/build/outputs/apk/release/app-universal-release.apk dist/KeyPop-RC45-universal-signed.apk
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk dist/KeyPop-RC45-x86_64-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/KeyPop-RC45-androidTest.apk
          for APK in dist/*-signed.apk; do
            "$APKSIGNER" verify "$APK"
            python3 - "$APKSIGNER" "$APK" <<'PY'
          import os,re,subprocess,sys
          a,p=sys.argv[1:]
          lines=subprocess.check_output([a,'verify','--print-certs',p],text=True).splitlines()
          digests=[]
          for line in lines:
              if 'certificate' not in line.lower():continue
              m=re.search(r'SHA[- ]?256\s+digest\s*:\s*([0-9a-fA-F:\s]+)',line,re.I)
              if m:
                  digest=re.sub('[^0-9a-fA-F]','',m.group(1)).lower()
                  if len(digest)==64:digests.append(digest)
          if digests!=['1ab47eb692c5f25d42cef11d6ae9993a31ae5fda157f7d7f41a400490db6e0a6']:
              raise SystemExit('Signing certificate mismatch')
          print('PASS permanent stable signer:',p)
          PY
            "$AAPT" dump badging "$APK" > /tmp/keypop-rc45-badging.txt
            grep -Fq "name='com.aetherkeys.keyboard.stablev2'" /tmp/keypop-rc45-badging.txt
            python3 - <<'PY'
          import re
          s=open('/tmp/keypop-rc45-badging.txt').read()
          v=int(re.search(r"versionCode='(\d+)'",s).group(1))
          assert v>=30000
          print('PASS stable versionCode',v)
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-RC45-signed-ARM64-and-Universal
          path: dist/*-signed.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPop-RC45-debug-emulator-inputs
          path: |
            dist/*-debug.apk
            dist/*-androidTest.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-RC45-signed-ARM64-and-Universal
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-RC45-debug-emulator-inputs
          path: dist
      - name: Download real signed RC44 for upgrade regression
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download v1.0.44-rc44-secure-vault-autofill-stable-signed --pattern 'KeyPop-RC44-universal-signed.apk' --dir dist --repo "$GH_REPO"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-keypop-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real RC44 to RC45 upgrade and full dashboard launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r dist/KeyPop-RC44-universal-signed.apk
            adb shell pm path com.aetherkeys.keyboard.stablev2 | grep -q package:
            adb install -r dist/KeyPop-RC45-universal-signed.apk
            adb shell pm path com.aetherkeys.keyboard.stablev2 | grep -q package:
            adb shell am start -W -n com.aetherkeys.keyboard.stablev2/com.aetherkeys.keyboard.MainActivity -a android.intent.action.MAIN -c android.intent.category.LAUNCHER
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep -F 'com.aetherkeys.keyboard.MainActivity'
            adb install -r dist/KeyPop-RC45-x86_64-debug.apk
            adb install -r dist/KeyPop-RC45-androidTest.apk
            adb shell am instrument -w -r -e class com.aetherkeys.keyboard.KeyPopRuntimeSmokeTest,com.aetherkeys.keyboard.KeyPopRC40WhatsAppEnterInstrumentedTest,com.aetherkeys.keyboard.KeyPopRC42UrlEditingInstrumentedTest,com.aetherkeys.keyboard.KeyPopRC44PrivateAutofillInstrumentedTest com.aetherkeys.keyboard.rc45preview.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/keypop-rc45-instrumentation.txt
            grep -E 'OK [(][0-9]+ tests?[)]' /tmp/keypop-rc45-instrumentation.txt
            ! grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' /tmp/keypop-rc45-instrumentation.txt

  publish:
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KeyPop-RC45-signed-ARM64-and-Universal
          path: dist
      - name: Publish signed RC45 only after all gates pass
        run: |
          set -euo pipefail
          gh release create v1.0.45-rc45-settings-restored-stable-signed dist/KeyPop-RC45-arm64-v8a-signed.apk dist/KeyPop-RC45-universal-signed.apk --target "$GITHUB_SHA" --prerelease --title 'KeyPop RC45 — Full settings restored' --notes 'Full RC40/RC44 features preserved. App icon now opens full Customize Keyboard, Typing, Translation, Clipboard & Security, and Tools settings directly. Same stablev2 app identity and signing certificate as RC44. Emulator validated in-place upgrade and launcher activity. Existing user data is not intentionally cleared.'
